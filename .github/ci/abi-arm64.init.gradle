// Gradle init script used by the release workflow to restrict the packaged
// native libraries to arm64-v8a only.
//
// It lives outside of the regular build scripts on purpose: the fork keeps
// merging upstream, and touching app/build.gradle would cause a conflict on
// every sync. Applied with `./gradlew -I .github/ci/abi-arm64.init.gradle`.

gradle.beforeProject { project ->
	project.plugins.withId('com.android.application') {
		def android = project.extensions.getByName('android')
		android.defaultConfig.ndk.abiFilters.clear()
		android.defaultConfig.ndk.abiFilters.add('arm64-v8a')
		project.logger.lifecycle("[ci] ${project.path}: abiFilters = ${android.defaultConfig.ndk.abiFilters}")
	}
}
